name: Create signing key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate keystore once
        run: |
          if [ -f keystore/release.keystore ]; then
            echo "Keystore already exists, nothing to do"
            exit 0
          fi
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/release.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Amilak Alayna, O=Amilak, C=SD"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add keystore/release.keystore
          git commit -m "Add permanent signing keystore"
          git push
