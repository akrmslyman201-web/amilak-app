name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name amilak_alayna --org com.amilak .
      - name: Patch manifest
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries><application|' $f
          sed -i 's|android:label="[^"]*"|android:label="عاملك علينا"|' $f
      - name: Use permanent signing key
        run: |
          if [ -f keystore/release.keystore ]; then
            mkdir -p ~/.android
            cp keystore/release.keystore ~/.android/debug.keystore
            echo "Using permanent key"
          else
            echo "No keystore found, using a temporary key"
          fi
      - run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release -t lib/app.dart
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
